<!DOCTYPE html>
<meta charset="utf-8">
<title>Neon World split test</title>
<template id="dev-builder-scripts">
<script src="../world/planner-tools.js?v=31"></script>
<script src="../world/dev-builder.js?v=31"></script>
</template>
<script>
fetch('../world-split.html').then(function (r) { return r.text(); }).then(function (html) {
  html = html.replace(/(\s(?:src|href)=")(?!https?:|\/|\.\.\/|#)([^"]+)/g, '$1../$2');
  document.open();
  document.write(html);
  document.close();
}).catch(function () {
  document.body.textContent = 'The test world did not load.';
});
</script>
