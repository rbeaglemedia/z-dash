<!DOCTYPE html>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Neon World test</title>
<template id="dev-builder-scripts">
<script src="world/planner-tools.js?v=dev38"></script>
<script src="world/dev-builder.js?v=dev38"></script>
</template>
<script>
/* P2 test page. The address stays /test/world.html, so the DEV Builder
   applies zdash.city.editor.v1 here and does not apply it on /world.html.
   This page registers only /test/sw.js. It does not install a worker at /. */
(function () {
  var LIVE = ['/jr.html', '/index.html', '/world.html', '/world-split.html', '/fly3.html'];
  function scrub() {
    if (!('caches' in window)) return;
    caches.keys().then(function (keys) {
      keys.forEach(function (k) {
        caches.open(k).then(function (c) {
          LIVE.forEach(function (logical) {
            var req = new Request(location.origin + logical);
            c.match(req).then(function (hit) {
              if (hit && String(hit.url).indexOf('/test/') !== -1) c.delete(req);
            });
          });
          c.keys().then(function (reqs) {
            reqs.forEach(function (req) {
              try { if (new URL(req.url).pathname.indexOf('/test/') === 0) c.delete(req); } catch (e) {}
            });
          });
        });
      });
    });
  }
  scrub();
  var n = 0, iv = setInterval(function () { scrub(); if (++n > 10) clearInterval(iv); }, 300);
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js', {scope:'/test/', updateViaCache:'none'}).catch(function () {});
  }
  var keep = '<script>(function(){var LIVE=["/jr.html","/index.html","/world.html","/world-split.html","/fly3.html"];function scrub(){if(!("caches" in window))return;caches.keys().then(function(keys){keys.forEach(function(k){caches.open(k).then(function(c){LIVE.forEach(function(logical){var req=new Request(location.origin+logical);c.match(req).then(function(hit){if(hit&&String(hit.url).indexOf("/test/")!==-1)c.delete(req);});});c.keys().then(function(reqs){reqs.forEach(function(req){try{if(new URL(req.url).pathname.indexOf("/test/")===0)c.delete(req);}catch(e){}});});});});});}scrub();var n=0,iv=setInterval(function(){scrub();if(++n>10)clearInterval(iv);},300);if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js",{scope:"/test/",updateViaCache:"none"}).catch(function(){});}})();<\/script>';
  fetch('../world.html', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
    html = html.replace(/(\s(?:src|href)=")(?!https?:|\/|\.\.\/|#|data:)([^"]+)/g, '$1../$2');
    html = html.replace(/navigator\.serviceWorker\.register\s*\([^;]*\)/g, 'void 0');
    var inject = '<script>try{var q=new URLSearchParams(location.search);if(q.get("dev")==="1")window.ZD_DEV_OPEN=1;if(q.get("apply")==="0")window.ZD_DEV_APPLY=0;}catch(e){}<\/script>'
      + '<script src="world/planner-tools.js?v=dev38"><\/script>'
      + '<script src="world/dev-builder.js?v=dev38"><\/script>';
    if (html.indexOf('world/city.js') < 0) throw new Error('city');
    html = html.replace(/(<script src="\.\.\/world\/city\.js[^"]*"><\/script>)/, '$1' + inject);
    html = html.replace('</body>', '<script src="world/drive-shot.js?v=dev38"><\/script></body>');
    if (html.indexOf('<head>') >= 0) html = html.replace('<head>', '<head>' + keep);
    else html = keep + html;
    document.open();
    document.write(html);
    document.close();
  }).catch(function () {
    document.body.textContent = 'The test world did not load.';
  });
})();
</script>
