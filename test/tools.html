<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dev Test Tools</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
<link rel="stylesheet" href="../shared/fonts/orbitron.css">
<link rel="stylesheet" href="../tools/dev/lil-gui.css">
<link rel="stylesheet" href="../tools/dev/hub.css">
<script>
(function () {
  function scrub() {
    if (!('caches' in window)) return;
    caches.keys().then(function (keys) {
      keys.forEach(function (k) {
        caches.open(k).then(function (c) {
          ['/jr.html', '/index.html', '/world.html', '/fly3.html'].forEach(function (logical) {
            var req = new Request(location.origin + logical);
            c.match(req).then(function (hit) {
              if (hit && String(hit.url).indexOf('/test/') !== -1) c.delete(req);
            });
          });
          c.keys().then(function (reqs) {
            reqs.forEach(function (req) {
              try { if (new URL(req.url).pathname.indexOf('/test/') === 0) c.delete(req); } catch (e) {}
            });
          });
        });
      });
    });
  }
  scrub();
  var n = 0, iv = setInterval(function () { scrub(); if (++n > 10) clearInterval(iv); }, 300);
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js', { scope: '/test/', updateViaCache: 'none' }).catch(function () {});
  }
})();
</script>
</head>
<body>
<p id="zroomlink" style="margin:0;padding:8px 12px;background:#03192f;color:#f4f8fc;font:700 14px Orbitron,sans-serif"><a href="room.html" style="color:#5fd4ff">Walk-in room</a> — blank room, player and pet, no car</p>
<div id="zapp"></div>
<script src="../shared/fps-counter.js"></script>
<script type="module" src="../tools/dev/hub.js"></script>
</body>
</html>
