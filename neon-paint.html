<script>
(function () {
  var q = location.search || '';
  var hash = location.hash || '';
  var wall = /(?:\?|&)mode=wall(?:&|$)/.test(q) || hash === '#wall' || /mode=wall/.test(hash);
  var vinyl = '';
  try { vinyl = new URLSearchParams(q).get('vinyl') || ''; } catch (e) { vinyl = ''; }
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'vinylNameInp' || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable) return;
  }, true);
  NEON_PAINT.openStudio(wall ? { page: true, canvas: 'wall' } : { page: true, canvas: 'car', vinyl: vinyl });
})();
</script>
</body>
