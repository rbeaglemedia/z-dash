<style>

<script>
"use strict";
/* NEONCHAR phase 1. Units/axes match world.html zModel: metres, x right, y up, z forward (car nose +z).
   ONE shared skeleton (same joints + bone lengths for both bodies) so every animation lines up; male/female differ only in
   shape (widths/thickness), hair and outfit. Saved to localStorage 'zdash.char.v1' for world.html to read later. */
const KEY='zdash.char.v1',H=1.75;
const HAIRS=['short','spiky','bob','long','ponytail','buns'];
/* Bob: one bright neon colour per character; only saturated neon picks, no dark/dull options */
const OUTFITS=['#3ee6ff','#ff3df2','#7cff4f','#ffb020','#ff4d5e','#b48cff','#fff04d','#ffffff'];
const GLOWS=OUTFITS;
const DEF={v:1,gender:'female',hair:'ponytail',outfit:'#ff3df2',glow:'#ff3df2'};
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.v===1){const c=Object.assign({},DEF,o);if(!GLOWS.includes(c.glow))c.glow=DEF.glow;c.outfit=c.glow;return c;}}catch(e){}return Object.assign({},DEF);}
let C=load();
function save(){C.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(C));}catch(e){}}

/* ---------- 370Z geometry (copied read-only from world.html zModel: ST body stations, RF roofline, doors) ---------- */
const ST=[[2.125,.70,.28,.56],[2.02,.84,.22,.62],[1.80,.90,.20,.70],[1.50,.925,.20,.78],[1.15,.92,.20,.80],[.80,.89,.22,.79],[.55,.88,.22,.80],
 [0,.87,.22,.84],[-.55,.88,.22,.88],[-1.05,.91,.22,.93],[-1.40,.925,.22,.95],[-1.75,.91,.24,.96],[-2.0,.86,.28,.95],[-2.125,.78,.32,.93]];
const RF=[[.55,.82,.80],[.05,1.20,.66],[-.25,1.32,.60],[-.65,1.29,.57],[-1.05,1.17,.52],[-1.45,1.04,.48],[-1.72,.97,.62]];
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>v<a?a:v>b?b:v,ease=t=>t*t*(3-2*t);
const rfAt=z=>{for(let i=0;i<RF.length-1;i++){const a=RF[i],b=RF[i+1];if(z<=a[0]&&z>=b[0]){const t=(a[0]-z)/(a[0]-b[0]);return[lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}}return null;};
const DOOR={z0:.55,z1:-.78,sill:.22,x:.9};
/* Interior (derived from the shell above + real 370Z packaging): left-hand drive, driver centre x=-0.37,
   seat cushion top y=0.34, seat H-point z=-0.42, floor y=0.14, pedals z≈+0.55, headliner = roof - 0.055 m. */
const SEAT={x:-.37,hy:.40,hz:-.42,cushion:.34,floor:.14,back:22,liner:.055};
const CAR={x:0,z:0,on:false};

/* ---------- shared skeleton: bone lengths as fractions of height (standard anthropometry) ---------- */
const B={leg:.530*H,thigh:.245*H,shin:.247*H,ankle:.038*H,foot:.15*H,spine:.17*H,chest:.115*H,neck:.045*H,head:.14*H,uarm:.186*H,farm:.146*H,hand:.09*H};
/* ragdoll-ready skeleton data: parent hierarchy, segment mass fractions (Dempster/Winter), joint limits (deg).
   fk() applies LIMITS to every pose, so physics/ragdoll can later drive the same joints with the same constraints. */
const SKEL=[{j:'pel',p:null,m:.142},{j:'waist',p:'pel',m:.139},{j:'chest',p:'waist',m:.216},{j:'neck',p:'chest',m:.012},{j:'head',p:'neck',m:.069},
 ...['L','R'].flatMap(k=>[{j:'hip'+k,p:'pel',m:0},{j:'knee'+k,p:'hip'+k,m:.100},{j:'ank'+k,p:'knee'+k,m:.0465},{j:'toe'+k,p:'ank'+k,m:.0145},
  {j:'sh'+k,p:'chest',m:0},{j:'el'+k,p:'sh'+k,m:.028},{j:'wr'+k,p:'el'+k,m:.016},{j:'hand'+k,p:'wr'+k,m:.006}])];
const LIMITS={hip:[-35,125],knee:[0,150],ank:[-30,45],sh:[-60,180],el:[0,150],lean:[-40,50],head:[-40,40],twist:[-50,50],roll:[-20,20],ao:[-10,90]};
function limit(p){const q=Object.assign({},p),c=(k,L)=>{if(q[k]!=null)q[k]=clamp(q[k],L[0],L[1]);};
 for(const k of['L','R']){c('hip'+k,LIMITS.hip);c('knee'+k,LIMITS.knee);c('ank'+k,LIMITS.ank);c('sh'+k,LIMITS.sh);c('el'+k,LIMITS.el);c('ao'+k,LIMITS.ao);}
 c('lean',LIMITS.lean);c('head',LIMITS.head);c('twist',LIMITS.twist);c('roll',LIMITS.roll);return q;}
const SH={male:{sh:.130*H,hip:.088*H,waist:.085*H,chest:.115,torsoD:.24,limb:1,neckW:.06},
          female:{sh:.114*H,hip:.098*H,waist:.072*H,chest:.10,torsoD:.21,limb:.86,neckW:.05}};
/* pose = {px,py,pz,yaw, lean(+fwd), hipL,hipR (+fwd), kneeL,kneeR (flex), shL,shR (+fwd), elL,elR (flex), armOut, legOut, head} angles deg */
const R=Math.PI/180;
function fk(p,shape){p=limit(p);const cy=Math.cos(p.yaw*R),sy=Math.sin(p.yaw*R);
 const W=(lx,ly,lz)=>[p.px+lx*cy+lz*sy,p.py+ly,p.pz-lx*sy+lz*cy]; // local: x right of body, z body-forward
 const J={};const pel=[0,0,0];
 const rl=(p.roll||0)*R,up=[Math.sin(rl),Math.cos(p.lean*R)*Math.cos(rl),Math.sin(p.lean*R)];pel[0]=p.sway||0;J.pel=W(...pel);const add=(a,d,l)=>[a[0]+d[0]*l,a[1]+d[1]*l,a[2]+d[2]*l];
 const waist=add(pel,up,B.spine*.5),chest=add(pel,up,B.spine),nk=add(chest,up,B.chest),hd=add(nk,[0,Math.cos((p.lean+p.head)*R),Math.sin((p.lean+p.head)*R)],B.neck);
 const top=add(hd,[0,Math.cos((p.lean+p.head)*R),Math.sin((p.lean+p.head)*R)],B.head);
 J.waist=W(...waist);J.chest=W(...chest);J.neck=W(...nk);J.head=W(...add(hd,[0,Math.cos((p.lean+p.head)*R),Math.sin((p.lean+p.head)*R)],B.head*.5));J.top=W(...top);J.chin=W(...hd);
 for(const s of[-1,1]){const k=s<0?'L':'R';
  const hip=[pel[0]+s*.09*H*.5*1.1,-.02+s*Math.sin(rl)*.05,0];const ha=p['hip'+k]*R,ka=(p['hip'+k]-p['knee'+k])*R,lo=(p.legOut||0)*R*s;
  const kn=[hip[0]+Math.sin(lo)*B.thigh,hip[1]-Math.cos(ha)*B.thigh*Math.cos(lo),hip[2]+Math.sin(ha)*B.thigh];
  const an=[kn[0]+Math.sin(lo)*B.shin*.6,kn[1]-Math.cos(ka)*B.shin,kn[2]+Math.sin(ka)*B.shin];
  const fa=ka+(90-(p['ank'+k]||0))*R;const toe=[an[0],an[1]-Math.cos(fa)*B.foot,an[2]+Math.sin(fa)*B.foot];
  J['hip'+k]=W(...hip);J['knee'+k]=W(...kn);J['ank'+k]=W(...an);J['toe'+k]=W(...toe);
  const shp=add(nk,[s*shape.sh,0,0],1);shp[1]-=.035;const sa=(p['sh'+k]+0)*R,ea=(p['sh'+k]+p['el'+k])*R,ao=((p['ao'+k]??p.armOut??0)+6)*R*s;
  const lean=p.lean*R;const rot=(v)=>v; // arms hang in world-down frame
  const el=[shp[0]+Math.sin(ao)*B.uarm,shp[1]-Math.cos(sa)*B.uarm*Math.cos(ao),shp[2]+Math.sin(sa)*B.uarm];
  const wr=[el[0]+Math.sin(ao)*B.farm*.5,el[1]-Math.cos(ea)*B.farm,el[2]+Math.sin(ea)*B.farm];
  const hn=[wr[0],wr[1]-Math.cos(ea)*B.hand*.8,wr[2]+Math.sin(ea)*B.hand*.8];
  const tw=(p.twist||0)*R,ct=Math.cos(tw),st=Math.sin(tw),T=v=>[nk[0]+(v[0]-nk[0])*ct+(v[2]-nk[2])*st,v[1],nk[2]-(v[0]-nk[0])*st+(v[2]-nk[2])*ct];
  J['sh'+k]=W(...T(shp));J['el'+k]=W(...T(el));J['wr'+k]=W(...T(wr));J['hand'+k]=W(...T(hn));
  J['wst'+k]=W(...add(waist,[s*shape.waist,0,0],1));J['hp'+k]=W(...[pel[0]+s*shape.hip,-.01,0]);}
 return J;}

/* ---------- animations (shared by both bodies) ---------- */
const P0={px:0,py:B.leg,pz:0,yaw:0,lean:0,head:0,hipL:0,hipR:0,kneeL:0,kneeR:0,ankL:0,ankR:0,shL:0,shR:0,elL:8,elR:8,armOut:0,legOut:0};
function mix(a,b,t){const o={};for(const k in a)o[k]=lerp(a[k],b[k]??a[k],t);return o;}
function legH(p){// pelvis height so lowest foot touches ground (inverse of fk vertical chain)
 const h=k=>Math.cos(p['hip'+k]*R)*B.thigh+Math.cos((p['hip'+k]-p['knee'+k])*R)*B.shin+B.ankle;return Math.max(h('L'),h('R'))+.02;}
function gait(t,run){const s=Math.sin(t*Math.PI*2),c=Math.cos(t*Math.PI*2),A=run?42:26;const p=Object.assign({},P0);
 p.hipL=A*s;p.hipR=-A*s;p.kneeL=(run?70:38)*Math.max(0,-c)+ (run?20:6);p.kneeR=(run?70:38)*Math.max(0,c)+(run?20:6);
 p.shL=-(run?55:24)*s;p.shR=(run?55:24)*s;p.elL=p.elR=run?85:18;p.lean=run?12:3;p.head=run?-6:-2;
 // foot pitch over each leg's cycle (+ = toe up): heel strike -> flat -> push-off -> swing
 const fp=ph=>{const u=((ph-.25)%1+1)%1,T=run?[18,0,-45,-8]:[15,0,-35,-5];if(u<.12)return lerp(T[0],T[1],ease(u/.12));if(u<.36)return T[1];if(u<.5)return lerp(T[1],T[2],ease((u-.36)/.14));if(u<.75)return lerp(T[2],T[3],ease((u-.5)/.25));return lerp(T[3],T[0],ease((u-.75)/.25));};
 for(const[k,ph]of[['L',t],['R',t+.5]]){const ka=p['hip'+k]-p['knee'+k];p['ank'+k]=ka-fp(ph);}
 p.sway=(run?.012:.022)*Math.sin(t*Math.PI*2);p.roll=(run?3:5)*Math.sin(t*Math.PI*2);p.twist=-(run?10:6)*s;
 p.py=B.leg;const J=fk(p,SH.female);p.py-=Math.min(J.toeL[1],J.toeR[1],J.ankL[1]-B.ankle*.7,J.ankR[1]-B.ankle*.7);return p;}
function idle(t){const p=Object.assign({},P0),b=Math.sin(t*Math.PI*2);p.lean=1+b*.8;p.shL=2+b*2;p.shR=2-b*2;p.elL=p.elR=10;p.hipL=3;p.hipR=-2;p.kneeL=5;p.kneeR=2;p.head=Math.sin(t*Math.PI*4)*1.5;p.py=legH(p)-.02+b*.004;return p;}
// seated: world-space pelvis = SEAT H-point, torso reclined SEAT.back, hips flexed, knees bent, feet on pedals
function sitPose(t){const p=Object.assign({},P0);p.px=CAR.x+SEAT.x;p.pz=CAR.z+SEAT.hz;p.py=SEAT.hy;p.yaw=0;p.lean=-SEAT.back;p.head=SEAT.back-6+Math.sin((t||0)*Math.PI*2)*1.2;
 p.hipL=p.hipR=95;p.kneeL=p.kneeR=39;p.ankL=p.ankR=-8;p.legOut=4;
 if(seatHands==='lap'){p.shL=p.shR=18;p.elL=p.elR=62;p.armOut=10;}else{p.shL=p.shR=80;p.elL=p.elR=14;p.armOut=-8+Math.sin((t||0)*Math.PI*2)*1;}
 p.head=SEAT.back-10+Math.sin((t||0)*Math.PI*2)*1.2;p.roll=Math.sin((t||0)*Math.PI*2)*.8;return p;}
let seatHands='wheel';
/* seated emotes: upper body only, hips stay on the cushion, arms kept inside the cabin (checked in fitCheck) */
function sitWave(t){const p=sitPose(t);const w=Math.sin(t*Math.PI*2*3);p.shR=72;p.aoR=4;p.elR=88+w*22;p.head=SEAT.back-4;p.twist=-4;p.roll=-3;p.shL=80;p.elL=14;p.aoL=-10;p.aoL=-10;return p;}
function sitDance(t){const b=t*8,k=Math.floor(b),f=b-k,hit=Math.sin(Math.PI*f),s=k%2?1:-1,p=sitPose(t);
 const up=(k%4===2||k%4===3);p.shL=up&&s<0?58:55+hit*10;p.shR=up&&s>0?78:55+hit*10;p.elL=p.shL>70?85:95;p.elR=p.shR>70?85:95;p.aoL=-10;p.aoR=-6;
 p.twist=s*12*ease(Math.min(1,f*3));p.roll=s*4;p.head=SEAT.back-6+hit*8;p.lean=-SEAT.back+hit*5;return p;}
/* get in (t 0..1): walk up outside the open left door -> face rear-quarter, duck + sit onto sill -> swing in -> settle. Get out = reverse. */
const GI=[ // [t, pose builder]  low-coupe technique: back to the seat, bottom in first, head ducks in last
 [0,  ()=>Object.assign(gait(0,false),{px:CAR.x-1.3,pz:CAR.z+.9,yaw:180})],
 [.18,()=>Object.assign(gait(.5,false),{px:CAR.x-1.2,pz:CAR.z-.15,yaw:200})],
 [.32,()=>{const p=idle(0);return Object.assign(p,{px:CAR.x-1.15,pz:CAR.z-.42,yaw:270})}], // back to the seat, outside the sill
 [.52,()=>Object.assign({},P0,{px:CAR.x-.78,pz:CAR.z-.42,py:.6,yaw:270,lean:38,head:-14,hipL:85,hipR:85,kneeL:95,kneeR:95,shL:40,shR:40,elL:30,elR:30,armOut:8})], // sit onto seat edge, head stays outside
 [.70,()=>Object.assign(sitPose(0),{px:CAR.x-.52,py:.44,yaw:320,lean:24,head:-16,hipL:90,hipR:80,kneeL:70,kneeR:95,legOut:10})], // duck + swing in
 [1,  ()=>sitPose(0)]];
function getIn(t){let i=0;while(i<GI.length-2&&t>GI[i+1][0])i++;const a=GI[i],b=GI[i+1],u=ease(clamp((t-a[0])/(b[0]-a[0]),0,1));
 const pa=a[1](),pb=b[1]();let dy=pb.yaw-pa.yaw;if(dy>180)dy-=360;if(dy<-180)dy+=360;const p=mix(pa,pb,u);p.yaw=pa.yaw+dy*u;return p;}
function dance(t){const b=t*8,k=Math.floor(b),f=b-k,e=f<.35?ease(f/.35):1,hit=Math.sin(Math.PI*f),p=idle(0),s=k%2?1:-1,ps=k%2?-1:1;
 const K=[ // 8-count: sway, sway, arm wave, arm wave, spin-pose, hit, body roll, pose
  {sway:.06,roll:8,twist:15,shL:40,shR:-10,aoL:30,aoR:10,elL:90,elR:20,head:-5},{sway:-.06,roll:-8,twist:-15,shR:40,shL:-10,aoR:30,aoL:10,elR:90,elL:20,head:5},
  {sway:.04,roll:6,shL:170,aoL:20,elL:20,shR:20,elR:60,twist:10},{sway:-.04,roll:-6,shR:170,aoR:20,elR:20,shL:20,elL:60,twist:-10},
  {twist:40,shL:90,aoL:70,elL:10,shR:90,aoR:70,elR:10,hipL:20,kneeL:35,head:-10},{lean:10,shL:60,shR:60,aoL:40,aoR:40,elL:110,elR:110,kneeL:25,kneeR:25,head:12},
  {lean:-8,roll:10,sway:.07,shL:120,shR:120,aoL:30,aoR:30,elL:70,elR:70},{shL:175,aoL:15,elL:5,shR:-20,aoR:35,elR:10,roll:-10,sway:-.05,hipR:15,kneeR:25,head:-8}];
 const a=Object.assign({},p,K[(k+7)%8]),c=Object.assign({},p,K[k%8]);const q=mix(Object.assign({sway:0,roll:0,twist:0,aoL:0,aoR:0},a),Object.assign({sway:0,roll:0,twist:0,aoL:0,aoR:0},c),e);
 q.kneeL+=8*hit;q.kneeR+=8*hit;q.py=legH(q)-.02-.03*hit;return q;}
const ANIMS={idle:{len:3.2,f:t=>idle(t),car:0},walk:{len:1.1,f:t=>Object.assign(gait(t,false),{pz:0}),car:0},run:{len:.68,f:t=>gait(t,true),car:0},
 sit:{len:4,f:t=>sitPose(t),car:1},getin:{len:3.4,f:t=>getIn(t),car:1,once:1},getout:{len:3.4,f:t=>getIn(1-t),car:1,once:1},dance:{len:4.2,f:t=>dance(t),car:0},sitwave:{len:2.4,f:t=>sitWave(t),car:1},sitdance:{len:4.2,f:t=>sitDance(t),car:1}};
let snapCam=0,anim='idle',aT=0,both=false,view=0,showFit=false;

/* ---------- seated fit checks (numbers exposed as window.CHARFIT) ---------- */
const glassX=(z,y)=>{const r=rfAt(z);return lerp(.88,r[1]+.04,clamp((y-.84)/(r[0]-.04-.84),0,1))-.03;}; // inner door glass half-width at height y
function fitCheck(){const J=fk(sitPose(0),SH.male),r=rfAt(J.top[2]-CAR.z);const liner=r[0]-SEAT.liner;
 const st=fk(Object.assign({},P0,{py:legH(P0)-.02}),SH.male);
 let minDoor=9,minDoorT=0,minRoof=9;for(let i=0;i<=200;i++){const t=i/200,q=getIn(t),j=fk(q,SH.male);
  for(const n of['top','head','sh'+'L','shR','neck']){const pnt=j[n],x=Math.abs(pnt[0]-CAR.x),z=pnt[2]-CAR.z;const rr=rfAt(z);if(!rr)continue;
   const rad=n==='top'?0:(n==='head'?B.head*.5:.05);
   if(x<DOOR.x+.08&&x>rr[1]-.05&&z<DOOR.z0&&z>DOOR.z1){const c=(rr[0]-.04)-(pnt[1]+ (n==='head'?rad:0));if(c<minDoor){minDoor=c;minDoorT=t;}}
   if(x<rr[1]-.05){const c=(rr[0]-SEAT.liner)-(pnt[1]+(n==='head'?rad:0));if(c<minRoof)minRoof=c;}}}
 const fl=Math.min(J.toeL[1],J.ankL[1]);
 const o={standingHeight:+(st.top[1]).toFixed(3),seatedHeadTopY:+J.top[1].toFixed(3),headlinerY:+liner.toFixed(3),headClearance:+(liner-J.top[1]).toFixed(3),
  hPoint:[+(J.pel[0]-CAR.x).toFixed(2),+J.pel[1].toFixed(2),+(J.pel[2]-CAR.z).toFixed(2)],seatBack:SEAT.back,
  shoulderHalfWidth:+(Math.abs(J.shL[0]-J.shR[0])/2).toFixed(3),cabinHalfWidthAtShoulder:+glassX(J.shL[2]-CAR.z,J.shL[1]).toFixed(3),
  leftShoulderToGlass:+(glassX(J.shL[2]-CAR.z,J.shL[1])-Math.abs(J.shL[0]-CAR.x)-.05).toFixed(3),
  footY:+fl.toFixed(3),floorY:SEAT.floor,footZ:+(J.toeL[2]-CAR.z).toFixed(2),pedalZ:.55,

 const p=(PCl.car&&!A.car)?sitPose(t):A.f(t);

 let pq=PCl.f(ptt,PC.type);if(RS&&(pm==='ride'||pm==='ridedance')){const u=(performance.now()-RS.t0)/(RS.len*1000);if(u<1)pq=reactPose(RS.name,u,PC.type);else RS=null;}
 if(window.__rfix){pq=reactPose(__rfix[0],__rfix[1],PC.type);}if(!PCl.car&&!A.car){pq.x+=p.px;}const PJ=petFk(pq,PC.type);const pdep=(pr(PJ.S)||[0,0,0,0])[3],cdep=(pr(fk(p,SH[C.gender]||SH.female).pel)||[0,0,0,0])[3];
 if(rgrid){const N=Object.keys(REACT).filter(n=>n!=='takeoff');ctx.font='600 11px system-ui';ctx.textAlign='center';
  Object.keys(PET_RIG).forEach((k,r)=>N.forEach((n,c)=>{const q=reactPose(n,.45,k);q.x=-2.5+c*.5;q.z=1.5-r*1.0;q.y=0;q.yaw=-20+(q.yaw||0);RENDER.drawPet(petFk(q,k),{type:k,glow:PET_COLORS[[3,1,2,0][r]]});
   if(r===0){const P=pr([q.x,-.02,q.z+.45]);if(P){ctx.fillStyle='#9fd';ctx.fillText(n.toUpperCase(),P[0],P[1]+14);}}}));window.PETSTATE={rgrid:1,frames:(window.PETSTATE?.frames||0)+1};return;}
 if(lineup){Object.keys(PET_RIG).forEach((k,i)=>{const q=PET_CLIPS[petMove==='auto'?'idle':petMove].f(ptt);q.x=-1.05+i*.7;q.z=0;q.yaw=-55;RENDER.drawPet(petFk(q,k),{type:k,glow:PET_COLORS[[3,1,2,0][i]]});});window.PETSTATE={lineup:1,frames:(window.PETSTATE?.frames||0)+1};return;}
 const petNear=pdep<cdep;if(!petNear)RENDER.drawPet(PJ,PC);
 if(both&&!CAR.on){const g2=C.gender==='male'?'female':'male';drawChar(Object.assign({},p,{px:p.px-.45}),C);drawChar(Object.assign({},p,{px:p.px+.45}),Object.assign({},C,{gender:g2,hair:C.gender==='male'?(C.hair==='short'||C.hair==='spiky'?'ponytail':C.hair):(C.hair==='ponytail'||C.hair==='buns'||C.hair==='long'?'short':C.hair)}));}
 else RENDER.drawCharacter(p,C);
 if(petNear)RENDER.drawPet(PJ,PC);
 if(CAR.on)drawCar(true,door,rdoor);window.PETSTATE={move:pm,t:+ptt.toFixed(3),type:PC.type,frames:(window.PETSTATE?.frames||0)+1};
 window.CHARSTATE={anim,t:+t.toFixed(3),frames:(window.CHARSTATE?.frames||0)+1};}

/* renderer interface: the only functions that draw. Rig + clips above are pure data/logic (no canvas), so a detailed
   or skinned-mesh renderer can replace these and reuse the same bones (fk / petFk joint names) and clips. */
const RENDER={drawCharacter:(pose,cfg)=>drawChar(pose,cfg),drawPet:(joints,cfg)=>PETRENDER.drawPet(joints,cfg),drawCar};
window.NEONRIG={char:{SKEL,LIMITS,B,SH,fk,clips:ANIMS},pet:{RIG:PET_RIG,fk:petFk,parts:petParts,clips:PET_CLIPS,auto:PET_AUTO},RENDER};
/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
function btn(par,label,on,fn,extra){const b=document.createElement('button');b.textContent=label;if(on)b.classList.add('on');b.onclick=fn;if(extra)extra(b);par.appendChild(b);return b;}
function ui(){document.documentElement.style.setProperty('--g',C.glow);
 const an=$('anims');an.innerHTML='';for(const k of Object.keys(ANIMS))btn(an,{getin:'GET IN',getout:'GET OUT',sitwave:'SEAT WAVE',sitdance:'SEAT DANCE'}[k]||k.toUpperCase(),anim===k,()=>{setAnim(k)});
 $('oG').innerHTML='';for(const k of['female','male'])btn($('oG'),k.toUpperCase(),C.gender===k,()=>{C.gender=k;save();ui();});
 $('oH').innerHTML='';for(const k of HAIRS)btn($('oH'),k.toUpperCase(),C.hair===k,()=>{C.hair=k;save();ui();});
 for(const[id,list,key]of[['oL',GLOWS,'glow']]){$(id).innerHTML='';for(const c of list)btn($(id),'',C[key]===c,()=>{C[key]=c;C.outfit=c;save();ui();},b=>{b.className='sw'+(C[key]===c?' on':'');b.style.background=c;b.style.boxShadow=key==='glow'?`0 0 10px ${c}`:'';b.title=c;});}
 $('pT').innerHTML='';for(const k in PET_RIG)btn($('pT'),PET_RIG[k].n,PC.type===k,()=>{PC.type=k;psave();ui();});
 $('pL').innerHTML='';for(const c of PET_COLORS)btn($('pL'),'',PC.glow===c,()=>{PC.glow=c;psave();ui();},b=>{b.className='sw'+(PC.glow===c?' on':'');b.style.background=c;b.style.boxShadow=`0 0 10px ${c}`;b.title='pet '+c;});
 $('pM').innerHTML='';for(const k of['auto','idle','sit','follow','trot','dance','hopin','hopout','ride','takeoff'])btn($('pM'),{hopin:'HOP IN',hopout:'HOP OUT'}[k]||k.toUpperCase(),petMove===k,()=>{petMove=k;pT=0;ui();});
 $('pS').innerHTML='';for(const k of['hatch','seat'])btn($('pS'),k==='hatch'?'BACK HATCH':'PASSENGER SEAT',spotName()===k,()=>{PC.spot=k;psave();ui();});
 $('pR').innerHTML='';for(const k of Object.keys(REACT))btn($('pR'),k.toUpperCase().replace('_',' '),false,()=>{if(PET_CLIPS[petMove]?.car!==1&&petMove!=='auto'||!(['ride','ridedance'].includes(petMove==='auto'?PET_AUTO[anim]:petMove))){petMove='ride';}if(REACT[k].full){petMove=REACT[k].full;pT=0;ui();return;}NEONPET.react(k);ui();});
 $('bBoth').classList.toggle('on',both);$('bFit').classList.toggle('on',showFit);$('bView').textContent='VIEW: '+VIEWS[view].n;
 const f=window.CHARFIT;$('fit').style.display=showFit?'block':'none';
 $('fit').textContent=`FIT (370Z, LHD driver)\nheight      ${f.standingHeight} m\nhead clear  ${(f.headClearance*100).toFixed(1)} cm\nH-point     x${f.hPoint[0]} y${f.hPoint[1]} z${f.hPoint[2]}\nshoulder→glass ${(f.leftShoulderToGlass*100).toFixed(1)} cm\nfeet y${f.footY} z${f.footZ}\ndoor min    ${(f.entryMinDoorClear*100).toFixed(1)} cm\nroof min    ${(f.entryMinRoofClear*100).toFixed(1)} cm\n${f.allPass?'ALL PASS':'CHECK FAIL'}`;}
function setAnim(k){anim=k;aT=0;if(ANIMS[k].car&&view!==3)view=1;ui();}
$('bBoth').onclick=()=>{both=!both;ui();};$('bView').onclick=()=>{view=(view+1)%VIEWS.length;ui();};$('bFit').onclick=()=>{showFit=!showFit;ui();};
$('bEd').onclick=()=>{$('panel').classList.toggle('hide');};
let drag=null;cv.addEventListener('pointerdown',e=>drag=[e.clientX,e.clientY]);addEventListener('pointerup',()=>drag=null);
cv.addEventListener('pointermove',e=>{if(!drag)return;VIEWS[view].yaw-= (e.clientX-drag[0])*.4;VIEWS[view].pitch=clamp(VIEWS[view].pitch+(e.clientY-drag[1])*.2,-5,60);drag=[e.clientX,e.clientY];});
// test hooks: ?anim=walk&t=.25&view=1&both=1&fit=1&ui=0
window.CK=CK;window.PET={get cfg(){return PC},RIG:PET_RIG,CLIPS:PET_CLIPS,fk:petFk,set:o=>{if(o.move)petMove=o.move;if(o.t!=null){paused=true;pT=o.t*PET_CLIPS[petMove==='auto'?'idle':petMove].len;}ui();}};
window.CHAR={get cfg(){return C},ANIMS,fk,SH,B,SEAT,set:(o)=>{if(o.anim)anim=o.anim;if(o.view!=null){view=o.view;cam=Object.assign(cam,VIEWS[view]);snapCam=1;}if(o.both!=null)both=o.both;if(o.t!=null){paused=true;aT=o.t*ANIMS[anim].len;}ui();}};
{const q=new URLSearchParams(location.search);const o={};if(q.get('anim'))o.anim=q.get('anim');if(q.get('view'))o.view=+q.get('view');if(q.get('both'))o.both=q.get('both')==='1';if(q.get('t'))o.t=+q.get('t');if(q.get('fit'))showFit=true;if(q.get('lineup'))lineup=true;if(q.get('rgrid'))rgrid=true;if(q.get('pet'))petMove=q.get('pet');if(q.get('pt')){paused=true;pT=+q.get('pt')*PET_CLIPS[petMove].len;}if(q.get('ui')==='0')$('panel').classList.add('hide');
 if(o.anim&&ANIMS[o.anim].car&&o.view==null)o.view=1;CHAR.set(o);}
ui();requestAnimationFrame(frame);
