<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
  <rect width="960" height="300" rx="16" fill="#14081f"/>
  <text x="24" y="32" fill="#fff6e4" font-family="ui-sans-serif, sans-serif" font-size="16" font-weight="700">Same three tricks on every device.</text>
  <text x="24" y="52" fill="#b9a6d6" font-family="ui-sans-serif, sans-serif" font-size="12">Swing, Spark, Shot. The pet has its own button. Aim assist stays on until she turns it off.</text>
  <g font-family="ui-sans-serif, sans-serif" font-size="12" fill="#fff6e4">
    <text x="48" y="86" fill="#3ee6ff" font-weight="700">Phone and iPad, landscape</text>
    <circle cx="110" cy="170" r="46" fill="none" stroke="#3ee6ff" stroke-width="3"/>
    <circle cx="110" cy="170" r="16" fill="#3ee6ff"/>
    <text x="110" y="236" text-anchor="middle">stick. rim is run</text>
    <text x="110" y="100" text-anchor="middle" fill="#b9a6d6">full push runs</text>
    <g>
      <circle cx="300" cy="120" r="26" fill="#241433" stroke="#ff4fd8" stroke-width="2"/>
      <text x="300" y="124" text-anchor="middle">pet</text>
      <circle cx="360" cy="150" r="28" fill="#241433" stroke="#3ee6ff" stroke-width="2"/>
      <text x="360" y="154" text-anchor="middle">Swing</text>
      <circle cx="410" cy="200" r="28" fill="#241433" stroke="#ffb020" stroke-width="2"/>
      <text x="410" y="204" text-anchor="middle">Spark</text>
      <circle cx="340" cy="230" r="28" fill="#241433" stroke="#b48cff" stroke-width="2"/>
      <text x="340" y="234" text-anchor="middle">Shot</text>
    </g>
    <text x="250" y="278" fill="#b9a6d6">iPad uses the same buttons, larger. A keyboard may help. It adds no fourth attack.</text>
    <text x="560" y="86" fill="#7cff4f" font-weight="700">PC</text>
    <text x="560" y="116">WASD walk. Shift runs.</text>
    <text x="560" y="138">E talk. A short push walks.</text>
    <text x="560" y="160">1 Swing. 2 Spark. 3 Shot.</text>
    <text x="560" y="182">Mouse aims Shot. Click lets go.</text>
    <text x="560" y="204">Q is the pet move.</text>
    <text x="560" y="226">Mouse aims only while the bow is up.</text>
    <text x="560" y="248" fill="#b9a6d6">The stroll camera stays behind her.</text>
  </g>
</svg>
