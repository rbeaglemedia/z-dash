<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520">
  <rect width="720" height="520" rx="16" fill="#14081f"/>
  <text x="24" y="32" fill="#fff6e4" font-family="ui-sans-serif, sans-serif" font-size="16" font-weight="700">Glasswick. One small town, three trails.</text>
  <text x="24" y="52" fill="#b9a6d6" font-family="ui-sans-serif, sans-serif" font-size="12">Not the Boulevards. NEXT keeps that map.</text>
  <g font-family="ui-sans-serif, sans-serif" font-size="12" fill="#fff6e4">
    <rect x="190" y="150" width="300" height="220" rx="18" fill="#1c1030" stroke="#3ee6ff" stroke-width="2"/>
    <text x="340" y="176" text-anchor="middle" font-weight="700">Lamp Square</text>
    <text x="340" y="194" text-anchor="middle" fill="#9adff0">safe. no foes. about 90 by 70 m</text>
    <rect x="214" y="214" width="70" height="40" rx="6" fill="#243044" stroke="#3ee6ff"/>
    <text x="249" y="238" text-anchor="middle">Lamp House</text>
    <rect x="300" y="214" width="70" height="40" rx="6" fill="#243044" stroke="#3ee6ff"/>
    <text x="335" y="238" text-anchor="middle">Pet porch</text>
    <rect x="386" y="214" width="80" height="40" rx="6" fill="#243044" stroke="#3ee6ff"/>
    <text x="426" y="238" text-anchor="middle">Glass tailor</text>
    <rect x="214" y="292" width="78" height="40" rx="6" fill="#243044" stroke="#ffb020"/>
    <text x="253" y="316" text-anchor="middle">Yard</text>
    <rect x="308" y="292" width="78" height="40" rx="6" fill="#243044" stroke="#ffb020"/>
    <text x="347" y="316" text-anchor="middle">Bun stall</text>
    <rect x="400" y="292" width="66" height="40" rx="6" fill="#10241c" stroke="#7cff4f"/>
    <text x="433" y="316" text-anchor="middle">Gate</text>
    <rect x="40" y="200" width="120" height="90" rx="12" fill="#1c1030" stroke="#ffb020" stroke-width="2"/>
    <text x="100" y="240" text-anchor="middle" font-weight="700">Meadow</text>
    <text x="100" y="258" text-anchor="middle" fill="#b9a6d6">snags</text>
    <path d="M160 245 H190" stroke="#ffb020" stroke-width="2"/>
    <rect x="250" y="40" width="180" height="80" rx="12" fill="#1c1030" stroke="#ff4fd8" stroke-width="2"/>
    <text x="340" y="76" text-anchor="middle" font-weight="700">Glass ruins</text>
    <text x="340" y="94" text-anchor="middle" fill="#b9a6d6">The Dim, once</text>
    <path d="M340 120 V150" stroke="#ff4fd8" stroke-width="2"/>
    <rect x="530" y="70" width="150" height="100" rx="12" fill="#1c1030" stroke="#b48cff" stroke-width="2"/>
    <text x="605" y="112" text-anchor="middle" font-weight="700">Ridge</text>
    <text x="605" y="130" text-anchor="middle" fill="#b9a6d6">the bell</text>
    <path d="M490 200 H530" stroke="#b48cff" stroke-width="2"/>
    <rect x="530" y="300" width="160" height="70" rx="12" fill="#10241c" stroke="#7cff4f" stroke-width="2"/>
    <text x="610" y="330" text-anchor="middle" font-weight="700">Yard Gate</text>
    <text x="610" y="348" text-anchor="middle" fill="#9ddec0">DRIVE to NEXT</text>
    <path d="M466 332 H530" stroke="#7cff4f" stroke-width="2"/>
  </g>
  <text x="24" y="430" fill="#fff6e4" font-family="ui-sans-serif, sans-serif" font-size="13">Houses: white walls, a glass bay, a cyan edge, a path, a door. One room loads when the door opens.</text>
  <text x="24" y="452" fill="#b9a6d6" font-family="ui-sans-serif, sans-serif" font-size="12">One chunk at a time on the iPad. The square unloads its detail while she is on a trail.</text>
  <text x="24" y="474" fill="#b9a6d6" font-family="ui-sans-serif, sans-serif" font-size="12">Furniture is not drawn from the street. Foes stop at a gate. They never enter Lamp Square.</text>
  <text x="24" y="500" fill="#6e6480" font-family="ui-sans-serif, sans-serif" font-size="11">Name pick: Glasswick. Homestead is the other choice, on NEXT's map. Brookhaven is the feel only.</text>
</svg>
