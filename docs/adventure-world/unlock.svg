<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 248" width="960" height="248">
  <rect width="960" height="248" rx="16" fill="#14081f"/>
  <text x="24" y="32" fill="#fff6e4" font-family="ui-sans-serif, sans-serif" font-size="16" font-weight="700">On foot. Five of seven jobs. Then the car key. Then NEXT's sky.</text>
  <text x="24" y="52" fill="#b9a6d6" font-family="ui-sans-serif, sans-serif" font-size="12">This file owns the walking. NEXT owns the road, the speed cap, the 400 ft line, and traffic.</text>
  <g font-family="ui-sans-serif, sans-serif" font-size="12" fill="#fff6e4">
    <g>
      <rect x="20" y="78" width="150" height="72" rx="10" fill="#241433" stroke="#3ee6ff" stroke-width="2"/>
      <text x="95" y="106" text-anchor="middle" font-weight="700">1. On foot</text>
      <text x="95" y="126" text-anchor="middle" fill="#b9a6d6">walk 3–4, run 8–10</text>
    </g>
    <g>
      <rect x="190" y="78" width="170" height="72" rx="10" fill="#241433" stroke="#ffb020" stroke-width="2"/>
      <text x="275" y="106" text-anchor="middle" font-weight="700">2. Five of seven</text>
      <text x="275" y="126" text-anchor="middle" fill="#b9a6d6">Swing, Spark, Shot</text>
    </g>
    <g>
      <rect x="380" y="78" width="150" height="72" rx="10" fill="#241433" stroke="#7cff4f" stroke-width="2"/>
      <text x="455" y="106" text-anchor="middle" font-weight="700">3. Car key</text>
      <text x="455" y="126" text-anchor="middle" fill="#9ddec0">jobs 6 and 7 wait</text>
    </g>
    <g>
      <rect x="550" y="78" width="170" height="72" rx="10" fill="#10241c" stroke="#7cff4f" stroke-width="2"/>
      <text x="635" y="106" text-anchor="middle" font-weight="700">4. Drive</text>
      <text x="635" y="126" text-anchor="middle" fill="#9ddec0">NEXT caps, traffic on</text>
    </g>
    <g>
      <rect x="740" y="78" width="190" height="72" rx="10" fill="#10241c" stroke="#3ee6ff" stroke-width="2"/>
      <text x="835" y="106" text-anchor="middle" font-weight="700">5. Sky</text>
      <text x="835" y="126" text-anchor="middle" fill="#b9a6d6">6 of 8 drive jobs</text>
    </g>
  </g>
  <path d="M170 114 H190 M360 114 H380 M530 114 H550 M720 114 H740" stroke="#3ee6ff" stroke-width="2"/>
  <text x="24" y="180" fill="#fff6e4" font-family="ui-sans-serif, sans-serif" font-size="13">Glasswick: STAY keeps walking, DRIVE opens NEXT. Homestead: she can park and get out, and traffic turns off.</text>
  <text x="24" y="202" fill="#b9a6d6" font-family="ui-sans-serif, sans-serif" font-size="12">Each town job pays 25 coins. The coins do not buy the key. She cannot launch the sky on foot.</text>
  <text x="24" y="226" fill="#6e6480" font-family="ui-sans-serif, sans-serif" font-size="11">Foes nearby: 3 on her iPad, 4 on the phone, 6 on a PC. The hub streets stay friendly.</text>
</svg>
