<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <title>Altitude band on the HUD</title>
  <rect width="760" height="360" fill="#100818"/>
  <text x="24" y="32" fill="#fff2c0" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700">HUD while she is in the sky</text>
  <!-- fake view -->
  <rect x="36" y="56" width="500" height="270" rx="12" fill="#07060f" stroke="#3a3050"/>
  <rect x="36" y="250" width="500" height="76" fill="#0c1a14"/>
  <rect x="80" y="214" width="40" height="50" fill="#123028" stroke="#7dff6b" stroke-opacity="0.6"/>
  <rect x="140" y="200" width="36" height="64" fill="#241808" stroke="#ffb020" stroke-opacity="0.5"/>
  <rect x="220" y="120" width="14" height="144" fill="#12323a" stroke="#3ee6ff" stroke-opacity="0.7"/>
  <!-- safe line across the view -->
  <line x1="48" y1="150" x2="524" y2="150" stroke="#ffe14d" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="56" y="142" fill="#ffe14d" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="700">400 FT</text>
  <!-- tiny Z above the line: same Z34 side as the ramp drawing -->
  <g transform="translate(250,78) scale(0.34)">
    <path fill="#c5c8ce" d="M78 150 C66 150 58 138 62 124 C66 110 76 102 94 100 L118 98 C136 94 150 84 164 70 C176 58 192 50 214 48 L240 48 C256 48 266 56 274 72 L292 100 L344 104 C360 102 372 94 380 84 C386 94 388 110 382 126 C376 140 364 150 346 152 L96 152 Z"/>
    <circle cx="118" cy="150" r="26" fill="#141414"/>
    <circle cx="300" cy="150" r="26" fill="#141414"/>
    <path fill="#1a2430" d="M178 60 C194 52 220 50 238 54 L254 74 L216 98 L178 94 Z"/>
    <path d="M330 108 C270 114 220 116 180 108 C158 102 140 92 124 82" fill="none" stroke="#2a2d33" stroke-width="3"/>
    <path d="M348 100 L378 88 L370 110 Z" fill="#e8f7ff"/>
    <circle cx="70" cy="114" r="6" fill="#ff2a3d"/>
    <circle cx="70" cy="130" r="6" fill="#ff2a3d"/>
  </g>
  <!-- speed -->
  <text x="56" y="300" fill="#fff" font-family="system-ui,Arial,sans-serif" font-size="28" font-weight="800">64 MPH</text>
  <text x="180" y="300" fill="#ffe14d" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700">MAX 65</text>
  <!-- altitude bar -->
  <rect x="580" y="56" width="54" height="270" rx="10" fill="#12081c" stroke="#3ee6ff" stroke-width="2"/>
  <rect x="598" y="78" width="18" height="226" rx="8" fill="#1a1028"/>
  <rect x="598" y="78" width="18" height="90" fill="#123038"/>
  <line x1="590" y1="168" x2="624" y2="168" stroke="#ffe14d" stroke-width="3"/>
  <circle cx="607" cy="130" r="7" fill="#3ee6ff"/>
  <text x="648" y="86" fill="#3ee6ff" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="700">SKY</text>
  <text x="648" y="172" fill="#ffe14d" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="700">400</text>
  <text x="648" y="292" fill="#ff4fd8" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="700">TOO LOW</text>
  <text x="560" y="352" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">Bar only shows in the sky, and on the ramp once it is unlocked.</text>
</svg>
