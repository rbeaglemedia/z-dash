<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Altitude bands for the Next world</title>
  <rect width="760" height="440" fill="#100818"/>
  <text x="24" y="32" fill="#fff2c0" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700">How high she is decides the picture and the speed</text>
  <!-- bands -->
  <rect x="40" y="70" width="470" height="70" fill="#102028"/>
  <rect x="40" y="140" width="470" height="50" fill="#1a1408"/>
  <rect x="40" y="190" width="470" height="90" fill="#1a1028"/>
  <rect x="40" y="280" width="470" height="110" fill="#0c1a14"/>
  <line x1="40" y1="140" x2="510" y2="140" stroke="#ffe14d" stroke-width="3"/>
  <line x1="40" y1="190" x2="510" y2="190" stroke="#ff4fd8" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- tower needle, 239 m, pokes into the sky band -->
  <rect x="430" y="96" width="18" height="294" fill="#12323a" stroke="#3ee6ff" stroke-width="2"/>
  <text x="454" y="120" fill="#3ee6ff" font-family="system-ui,Arial,sans-serif" font-size="12">Sky tower</text>
  <text x="454" y="136" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="11">239 m, still there</text>
  <!-- jump roof -->
  <rect x="300" y="248" width="46" height="142" fill="#1a2830" stroke="#3ee6ff" stroke-width="1.5"/>
  <text x="250" y="270" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="11">Jump roof 62 m</text>
  <!-- houses -->
  <rect x="70" y="330" width="70" height="60" fill="#163028" stroke="#7dff6b"/>
  <polygon points="70,330 105,308 140,330" fill="#163028" stroke="#7dff6b"/>
  <rect x="160" y="318" width="54" height="72" fill="#2a2418" stroke="#ffb020"/>
  <text x="70" y="408" fill="#7dff6b" font-family="system-ui,Arial,sans-serif" font-size="12">Homestead houses, full detail</text>
  <!-- labels -->
  <text x="524" y="108" fill="#3ee6ff" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700">SKY</text>
  <text x="524" y="126" fill="#c5c8ce" font-family="system-ui,Arial,sans-serif" font-size="12">Above 400 ft</text>
  <text x="524" y="142" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="11">Cheap cards, higher cap</text>
  <text x="524" y="172" fill="#ffe14d" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700">HOLD UP</text>
  <text x="524" y="188" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="11">400 to 500 ft</text>
  <text x="524" y="236" fill="#ff4fd8" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700">LOW AIR</text>
  <text x="524" y="254" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="11">Under 400 ft</text>
  <text x="524" y="270" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="11">Ground cap, boxes only</text>
  <text x="524" y="330" fill="#7dff6b" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700">STREET</text>
  <text x="524" y="348" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="11">On the ground</text>
  <text x="524" y="364" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="11">Pretty homes, slow cap</text>
  <text x="48" y="132" fill="#ffe14d" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="700">SAFE LINE · 400 FT</text>
</svg>
