<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>On foot, then the car key, then the sky</title>
  <rect width="760" height="420" fill="#100818"/>
  <text x="24" y="32" fill="#fff2c0" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700">Unlock path. She starts on foot.</text>
  <text x="24" y="52" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">Three chapters. The car and the sky stay locked until the jobs in front of them are done.</text>

  <!-- day one -->
  <rect x="24" y="78" width="210" height="250" rx="12" fill="#142018" stroke="#7dff6b" stroke-width="2"/>
  <text x="40" y="106" fill="#7dff6b" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="700">1. ON FOOT</text>
  <text x="40" y="126" fill="#fff2c0" font-family="system-ui,Arial,sans-serif" font-size="12">Day one. Homestead.</text>
  <circle cx="78" cy="168" r="14" fill="#ffe14d"/>
  <rect x="68" y="184" width="20" height="28" rx="4" fill="#7dff6b"/>
  <rect x="108" y="196" width="22" height="12" rx="6" fill="#ffb020"/>
  <text x="40" y="240" fill="#fff" font-family="system-ui,Arial,sans-serif" font-size="12">Ellie and one pet.</text>
  <text x="40" y="258" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">Walk and run.</text>
  <text x="40" y="276" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">Town jobs. No car.</text>
  <text x="40" y="294" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">No sky. No traffic.</text>

  <path d="M244 190 H286" stroke="#fff2c0" stroke-width="2" fill="none"/>
  <path d="M278 184 L292 190 L278 196" fill="#fff2c0"/>

  <!-- car key -->
  <rect x="292" y="78" width="210" height="250" rx="12" fill="#102028" stroke="#3ee6ff" stroke-width="2"/>
  <text x="308" y="106" fill="#3ee6ff" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="700">2. CAR KEY</text>
  <text x="308" y="126" fill="#fff2c0" font-family="system-ui,Arial,sans-serif" font-size="12">5 of 7 town jobs.</text>
  <path fill="#c5c8ce" d="M318 168 C314 168 312 164 313 160 C316 154 322 152 330 154 L348 156 L360 150 L368 158 L352 166 L320 168 Z"/>
  <circle cx="326" cy="168" r="5" fill="#141414"/>
  <circle cx="356" cy="168" r="5" fill="#141414"/>
  <text x="308" y="240" fill="#fff" font-family="system-ui,Arial,sans-serif" font-size="12">The Z leaves the garage.</text>
  <text x="308" y="258" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">Caps 25 / 35 / 45 mph.</text>
  <text x="308" y="276" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">Two live traffic cars.</text>
  <text x="308" y="294" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">She can still get out.</text>

  <path d="M512 190 H554" stroke="#fff2c0" stroke-width="2" fill="none"/>
  <path d="M546 184 L560 190 L546 196" fill="#fff2c0"/>

  <!-- sky -->
  <rect x="560" y="78" width="176" height="250" rx="12" fill="#241808" stroke="#ffe14d" stroke-width="2"/>
  <text x="576" y="106" fill="#ffe14d" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="700">3. SKY</text>
  <text x="576" y="126" fill="#fff2c0" font-family="system-ui,Arial,sans-serif" font-size="12">6 of 8 drive jobs.</text>
  <line x1="584" y1="168" x2="712" y2="168" stroke="#ffe14d" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="584" y="160" fill="#ffe14d" font-family="system-ui,Arial,sans-serif" font-size="11" font-weight="700">400 FT</text>
  <path fill="#c5c8ce" d="M600 150 C596 150 594 146 595 142 C598 136 604 134 612 136 L630 138 L642 132 L650 140 L634 148 L602 150 Z"/>
  <text x="576" y="240" fill="#fff" font-family="system-ui,Arial,sans-serif" font-size="12">Ramp on the pad.</text>
  <text x="576" y="258" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">Sky 65 / 90 / 120.</text>
  <text x="576" y="276" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">One bounce, then</text>
  <text x="576" y="294" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">the neon portal.</text>

  <text x="24" y="360" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">A parent switch can open a chapter for testing. She does not see that switch.</text>
  <text x="24" y="382" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">On foot she cannot launch. The sky is a car thing.</text>
</svg>
