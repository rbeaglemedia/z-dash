<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280">
  <title>Rare traffic versus light traffic</title>
  <rect width="760" height="280" fill="#100818"/>
  <text x="24" y="32" fill="#fff2c0" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700">Two densities. Same Z.</text>
  <text x="24" y="52" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">Nose to the right. Gaps are the idea, not a measured map.</text>
  <defs>
    <g id="z34">
      <path fill="#c5c8ce" d="M4 28 C2 28 0 24 1 18 C2 13 5 10 10 9 L16 8 C20 7 23 4 26 0 C28 -4 32 -6 38 -6 L46 -6 C50 -6 52 -4 54 0 L58 8 L74 9 C78 8 82 5 84 2 C86 5 86 10 84 16 C82 22 78 26 72 27 L8 27 Z"/>
      <circle cx="16" cy="28" r="6" fill="#141414"/>
      <circle cx="64" cy="28" r="6" fill="#141414"/>
      <path fill="#1a2430" d="M30 -2 C34 -6 42 -6 48 -4 L52 2 L40 8 L30 6 Z"/>
      <circle cx="2" cy="14" r="1.6" fill="#ff2a3d"/>
      <circle cx="2" cy="19" r="1.6" fill="#ff2a3d"/>
    </g>
  </defs>
  <!-- rare -->
  <text x="24" y="84" fill="#7dff6b" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700">RARE · 2 cars · about 100 m</text>
  <line x1="24" y1="128" x2="736" y2="128" stroke="#3ee6ff" stroke-width="2" opacity="0.45"/>
  <use href="#z34" x="70" y="96"/>
  <use href="#z34" x="520" y="96"/>
  <text x="250" y="122" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">empty street</text>
  <!-- light -->
  <text x="24" y="176" fill="#ffb020" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700">LIGHT · 4 cars · about 45 m</text>
  <line x1="24" y1="228" x2="736" y2="228" stroke="#3ee6ff" stroke-width="2" opacity="0.45"/>
  <use href="#z34" x="40" y="196"/>
  <use href="#z34" x="210" y="196"/>
  <use href="#z34" x="380" y="196"/>
  <use href="#z34" x="550" y="196"/>
  <text x="24" y="264" fill="#8a7a9d" font-family="system-ui,Arial,sans-serif" font-size="12">Past the pretty ring, light adds two dots. Rare adds none. The live worlds 30 cars stay on the old page.</text>
</svg>
